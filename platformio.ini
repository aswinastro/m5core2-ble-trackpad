; PlatformIO Project Configuration File for M5Stack Core2 BLE Cyberpunk Mouse
;
; Build and flash using PlatformIO in VS Code, or CLI:
;   pio run --target upload

[platformio]
default_envs = m5stack-core2
src_dir = src
include_dir = include

[env:m5stack-core2]
platform = espressif32 @ ^6.4.0
board = m5stack-core2
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Board build configuration
board_build.partitions = huge_app.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; Compiler optimizations & flags
build_flags =
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -D USE_NIMBLE
    -D CORE_DEBUG_LEVEL=0
    -O2

; External dependencies:
; - M5Core2: Official M5Stack Core2 hardware HAL (LCD, AXP192, Touch FT6336U)
; - ESP32 BLE Mouse (T-vK): BLE HID mouse implementation
; - NimBLE-Arduino: High performance, ultra low memory BLE stack
lib_deps =
    m5stack/M5Core2 @ ^0.1.9
    t-vk/ESP32 BLE Mouse @ ^0.3.1
    h2zero/NimBLE-Arduino @ ^1.4.1
